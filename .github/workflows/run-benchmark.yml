name: Run synthetic attack-path benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/run-benchmark.yml'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute experiment
        run: python src/run_experiment.py
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - name: Publish run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-attack-path-results
          path: |
            data/*.csv
            results/*.csv
            results/*.json
